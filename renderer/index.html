<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; media-src http://127.0.0.1:* blob:; img-src 'self' data:; script-src 'self'">
<title>ДваРяда</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=PT+Serif:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ДваРяда<span class="two">2</span></h1><small class="nowname" id="nowName">плеер с двойными субтитрами</small></div>
    <div class="loaders">
      <button class="btn primary" id="bOpen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg>
        Открыть фильм</button>
      <button class="btn" id="bSubs" disabled><span class="dot" id="dot1"></span><span class="dot" id="dot2" style="margin-left:-4px"></span>Субтитры и озвучка</button>
    </div>
  </header>

  <main class="app">
    <section id="player" aria-label="Плеер">
      <div class="stage" id="stage">
        <video id="video" playsinline preload="auto"></video>
        <div class="welcome" id="welcome">
          <div class="box">
            <div class="drop">
              <h2>Откройте фильм в оригинале</h2>
              <p>Перетащите файл сюда или нажмите кнопку. Пока фильм открывается, плеер найдёт субтитры по названию и спросит, какие показать.</p>
              <button class="btn primary" id="bOpen2">Выбрать файл</button>
            </div>
            <p id="welcomeHint"></p>
          </div>
        </div>
        <div class="buffer" id="buffer" hidden><span class="spin"></span></div>
        <div class="stack top" id="stackTop"></div>
        <div class="stack bottom" id="stackBottom"></div>
        <div class="center-msg" id="msg" hidden><p id="msgText"></p></div>
      </div>
      <div class="ctrls">
        <div class="seek">
          <span class="time" id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <span class="time" id="tDur">0:00</span>
        </div>
        <div class="cbar">
          <button class="ib" id="bPrev" title="Предыдущая фраза (A)"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg></button>
          <button class="ib play" id="bPlay" title="Пуск / пауза (Пробел)"><svg viewBox="0 0 24 24" id="icPlay"><path d="M7 4v16l13-8Z"/></svg></button>
          <button class="ib" id="bNext" title="Следующая фраза (D)"><svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg></button>
          <button class="ib" id="bRepeat" title="Повторить фразу (S)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Повтор</button>
          <button class="chip" id="chip1" title="Показать/скрыть ряд 1 (клавиша 1)"><span class="dot"></span>1</button>
          <button class="chip" id="chip2" title="Показать/скрыть ряд 2 (клавиша 2)"><span class="dot"></span>2</button>
          <button class="ib" id="bSubs2" title="Сменить субтитры и озвучку (C)"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 12h4M14 12h4M6 15h8"/></svg>Сменить</button>
          <span class="sp"></span>
          <select class="rate" id="rate" aria-label="Скорость">
            <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
          </select>
          <input type="range" id="vol" min="0" max="1" step="0.05" value="1" style="width:80px" aria-label="Громкость">
          <button class="ib" id="bFs" title="Во весь экран (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="text">Текст</button>
        <button role="tab" aria-selected="false" data-tab="look">Настройки</button>
        <button role="tab" aria-selected="false" data-tab="dict">Словарь<span class="n" id="dictN">0</span></button>
      </div>
      <div class="pane" id="pText"><div class="tl" id="tl"></div></div>
      <div class="pane" id="pLook" hidden></div>
      <div class="pane" id="pDict" hidden>
        <div class="toolbar">
          <button class="btn sm" id="bExport">Сохранить CSV</button>
          <button class="btn sm" id="bCopy">Копировать список</button>
        </div>
        <div class="dict" id="dict"></div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="picker" hidden>
  <div class="dlg" role="dialog" aria-labelledby="pkTitle">
    <header>
      <h2 id="pkTitle">Какие субтитры нужны? <small id="pkFile"></small></h2>
      <div class="q">
        <input type="text" class="title" id="qTitle" placeholder="Название фильма или сериала" aria-label="Название">
        <input type="number" class="num" id="qYear" placeholder="Год" aria-label="Год">
        <input type="number" class="num" id="qSeason" placeholder="Сезон" aria-label="Сезон">
        <input type="number" class="num" id="qEp" placeholder="Серия" aria-label="Серия">
        <button class="btn sm" id="qGo">Искать</button>
      </div>
      <div class="langs" id="langs"></div>
    </header>
    <div class="body" id="pkBody"></div>
    <footer>
      <div class="sum" id="pkSum"></div>
      <button class="btn sm" id="pkOwn">Свой файл…</button>
      <button class="btn primary" id="pkOk">Смотреть</button>
    </footer>
  </div>
</div>

<script src="subs.js"></script>
<script src="app.js"></script>
</body>
</html>
