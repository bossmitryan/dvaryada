name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk DvaRyada.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Приложение для планшета
          body: "Сборка 1.0.${{ github.run_number }} (${{ github.sha }}). ПК раздаёт этот файл планшету сам: Настройки → Планшет → Привязать планшет."
          files: DvaRyada.apk
          overwrite_files: true
          make_latest: true

      # копия APK в репозитории: ПК получает её вместе с кнопкой «Обновить»
      # и раздаёт планшету без обращения к серверам GitHub с файлами релизов
      - name: Put APK into repo
        run: |
          mkdir -p android-dist
          cp DvaRyada.apk android-dist/DvaRyada.apk
          echo "1.0.${{ github.run_number }}" > android-dist/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-dist
          git commit -m "APK 1.0.${{ github.run_number }} для планшета" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
